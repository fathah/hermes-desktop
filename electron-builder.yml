appId: com.nousresearch.hermes
# productName is now space-free so the Linux .deb installs to
# /opt/HermesOne/hermes-agent instead of `/opt/Hermes One/hermes-agent`.
# The previous path crashed Chromium's zygote on launch because
# argv[0] containing whitespace is forwarded verbatim into execvp and
# fails with EINVAL (SIGTRAP). See issue #877.
#
# The user-facing display name "Hermes One" is restored through
# `linux.desktop.entry.Name`, `nsis.shortcutName`, `nsis.uninstallDisplayName`,
# and `mac.extendInfo.CFBundleDisplayName` so end users see no change.
productName: HermesOne
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/build/Release/*.node
win:
  executableName: hermes-agent
  target:
    - nsis
    - portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  # Restore user-facing installer / shortcut name now that productName is
  # space-free.
  shortcutName: Hermes One
  uninstallDisplayName: Hermes One
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsUsageDescription: Application requests access to the device's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - CFBundleDisplayName: Hermes One
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  vendor: Nous Research
  category: Utility
  synopsis: Self-improving AI assistant desktop app
  description: >-
    Hermes One is a native desktop app for installing, configuring, and chatting
    with Hermes Agent — a self-improving AI assistant with tool use, multi-platform
    messaging, and a closed learning loop.
  # Override the user-facing .desktop display name (default would now be
  # "HermesOne" since productName is space-free). See issue #877.
  desktop:
    entry:
      Name: Hermes One
      Comment: Hermes One — self-improving AI assistant desktop app
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  # Run chmod 4755 on chrome-sandbox so Electron's setuid sandbox helper
  # works on modern Linux distros that disable unprivileged user
  # namespaces (Ubuntu 24.04+, etc.). Closes #395.
  afterInstall: build/linux-after-install.sh
rpm:
  artifactName: ${name}-${version}-${ext}
  # Same SUID fix for .rpm consumers (Fedora 40+ also restricts userns).
  afterInstall: build/linux-after-install.sh
npmRebuild: false
publish:
  provider: github
  owner: fathah
  repo: hermes-desktop
