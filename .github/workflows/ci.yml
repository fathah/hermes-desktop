name: CI

# Runs the type checker and test suite on every PR and on pushes to main,
# so broken code is caught before it merges. Mirrors the Node version and
# install step already used by release.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:ci

      - name: Generate CycloneDX SBOM
        # Excalidraw's React 17/18 peer metadata is an accepted residual in this
        # React 19 app; lockfile mode keeps npm SBOM generation reproducible.
        run: npm sbom --package-lock-only --legacy-peer-deps --sbom-format cyclonedx --sbom-type application > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  verify-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build app
        run: npm run build

      - name: Verify note index
        run: npm run verify:note-index

      - name: Verify external context
        run: npm run verify:external-context

      - name: SPS smoke
        env:
          SMOKE_OUT: ${{ runner.temp }}/sps-smoke
        run: xvfb-run -a node scripts/sps-smoke.mjs

      - name: Upload SPS smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sps-smoke-screenshots
          path: ${{ runner.temp }}/sps-smoke
          if-no-files-found: ignore
